<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>Yellow - hejrafa</title>
  <link rel="icon" href="/favicon.ico?v=20260526a" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=20260526a">
  <link rel="icon" href="/favicon.svg?v=20260526a" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/hej-logo.svg">
  <link rel="stylesheet" href="/yellow/assets/css/finance.css?v=20260706-finance-live3">
  <link rel="stylesheet" href="/yellow/assets/css/yellow.css?v=20261102-private">
    <link rel="stylesheet" href="/yellow/assets/css/rewind.css?v=20260822-rewind25">
  <script src="/yellow/assets/js/yellow.js?v=20261102-private" defer=""></script>
    <script type="module" src="/yellow/assets/js/rewind.js?v=20260822-rewind25"></script>
</head>
<body class="is-locked" data-view="health">
  <div class="yellow-app" aria-live="polite">
    <main class="yellow-shell" aria-label="Private yellow dashboard">
      <header class="yellow-top-mark">
        <a href="/" aria-label="Hej Rafa home">
          <img src="/assets/icons/hej-logo.svg" alt="">
        </a>
      </header>

      <div class="yellow-stage" data-yellow-stage>
        <section class="yellow-panel rewind-page" data-yellow-page="rewind" aria-label="Rewind" aria-hidden="true">
          <div data-rewind-root></div>
        </section>
      </div>
    </main>

    <nav class="yellow-dock" data-selected="health" aria-label="Yellow sections">
      <span class="yellow-dock-thumb" aria-hidden="true"></span>
      <button class="yellow-dock-item is-selected" type="button" data-yellow-nav="health" aria-current="page">Health</button>
      <button class="yellow-dock-item" type="button" data-yellow-nav="finance">Finance</button>
      <button class="yellow-dock-item" type="button" data-yellow-nav="letter">Letter</button>
      <button class="yellow-dock-item" type="button" data-yellow-nav="rewind">Rewind</button>
    </nav>
  </div>

  <div class="yellow-gate" aria-label="Password required">
    <form class="yellow-gate-form" data-yellow-gate="" autocomplete="off">
      <label class="visually-hidden" for="yellow-password">Password</label>
      <input id="yellow-password" type="password" name="password" inputmode="text" aria-label="Password" autocomplete="off" autocapitalize="none" enterkeyhint="go" data-yellow-password="">
    </form>
  </div>




</body>
</html>
