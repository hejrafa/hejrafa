<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Not found · Rafael Polutta</title>
  <link rel="icon" href="/favicon.ico?v=20260526a" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=20260526a">
  <link rel="icon" href="/favicon.svg?v=20260526a" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/hej-logo.svg">
  <script src="/assets/js/not-found.js?v=20261117-404" defer></script>
  <style>
    /* The page a missing address lands on. A playground: the zero is a thought bubble (an empty one: no
       mental pictures, see the About page), and the good bits from the home page's curiosity wall rain down
       and pile up behind the words. The mouse bounces them; a click kicks them; the bubble drops more.
       not-found.js moves things; the page reads and works without it. */
    @font-face {
      font-family: "Redaction";
      font-style: normal;
      font-display: swap;
      font-weight: 400;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/redaction@latest/latin-400-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "Redaction";
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/redaction@latest/latin-700-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "Redaction 10";
      font-style: normal;
      font-display: swap;
      font-weight: 700;
      src: url("https://cdn.jsdelivr.net/fontsource/fonts/redaction-10@latest/latin-700-normal.woff2") format("woff2");
    }

    :root {
      --paper: #fff6cf;
      --ink: #141313;
      --cream: #fff8ea;
      --nav-frame: #101010;
      --display: "Redaction", Georgia, serif;
      --mono: "IBM Plex Mono", "Courier New", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--display);
    }

    img {
      display: block;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .not-found {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(42px, 6.4vh, 84px) 18px clamp(150px, 28svh, 280px);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 34%),
        var(--paper);
    }

    .top-mark {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
    }

    .top-mark > a {
      display: block;
      width: clamp(84px, 6vw, 110px);
      filter: drop-shadow(0 10px 0 rgba(45, 5, 4, 0.12));
      transition: transform 190ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-mark img {
      width: 100%;
    }

    .top-mark > a:hover,
    .top-mark > a:focus-visible {
      transform: translateY(-4px) rotate(-7deg) scale(1.1);
    }

    /* The words sit above the pile. */
    .not-found-words {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: min(100%, 760px);
      padding-top: clamp(16px, 3svh, 40px);
      text-align: center;
    }

    .not-found-eyebrow {
      margin: 0 0 clamp(10px, 2svh, 22px);
      padding: 6px 12px 7px;
      border-radius: 999px;
      background: #ffd600;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      rotate: -3deg;
      animation: rise 600ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .not-found-code {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: "Redaction 10", var(--display);
      font-size: clamp(96px, min(28vw, 21svh), 200px);
      font-weight: 700;
      line-height: 0.8;
      text-shadow: 0 8px 0 rgba(20, 19, 19, 0.08);
      animation: rise 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 60ms both;
    }

    /* The zero: an empty thought bubble with a die-cut edge. A tap thinks of a few more good bits. */
    .not-found-bubble {
      width: 0.86em;
      margin: 0 0.02em;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      font: inherit; /* buttons don't inherit the font size, and the bubble is sized in em */
      cursor: pointer;
      rotate: 8deg;
      translate: 0 0.04em;
      -webkit-tap-highlight-color: transparent;
      animation: drift 3.5s ease-in-out infinite alternate;
    }

    .not-found-bubble img {
      width: 100%;
      height: auto;
      filter:
        drop-shadow(4px 0 0 #fffdf6)
        drop-shadow(-4px 0 0 #fffdf6)
        drop-shadow(0 4px 0 #fffdf6)
        drop-shadow(0 -4px 0 #fffdf6)
        drop-shadow(0 12px 14px rgba(45, 5, 4, 0.22));
      transition: scale 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .not-found-bubble:hover img {
      scale: 1.05;
    }

    .not-found-bubble.is-puffing img {
      animation: puff 420ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .not-found-bubble:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 0.06em;
      border-radius: 40%;
    }

    .not-found-words h1 {
      max-width: 11em;
      margin: clamp(16px, 3svh, 34px) 0 0;
      font-size: clamp(32px, min(4.6vw, 6.6svh), 58px);
      font-weight: 700;
      line-height: 0.98;
      text-wrap: balance;
      animation: rise 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 120ms both;
    }

    .not-found-words p.not-found-copy {
      margin: clamp(14px, 2svh, 22px) 0 0;
      font-size: clamp(18px, 1.7vw, 22px);
      line-height: 1.3;
      text-wrap: balance;
      animation: rise 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 180ms both;
    }

    /* The way back: the dock's dark pill. */
    .not-found-home {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      margin-top: clamp(20px, 3.2svh, 34px);
      padding: 14px 28px 15px;
      border-radius: 999px;
      background: var(--nav-frame);
      color: var(--cream);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      box-shadow:
        0 7px 0 rgba(16, 16, 16, 0.22),
        0 18px 26px rgba(20, 19, 19, 0.14);
      transition: transform 180ms cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: rise 700ms cubic-bezier(0.34, 1.56, 0.64, 1) 240ms both;
    }

    .not-found-home:hover,
    .not-found-home:focus-visible {
      transform: translateY(-2px) rotate(-1.5deg);
    }

    .not-found-home:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 4px;
    }

    /* The falling good bits: under the words, above the paper. not-found.js places each one. */
    .fall {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
    }

    .fall-item {
      position: absolute;
      top: 0;
      left: 0;
      padding: 3px;
      border-radius: 11px;
      background: #fffdf6;
      box-shadow:
        0 6px 0 rgba(45, 5, 4, 0.12),
        0 14px 24px rgba(45, 5, 4, 0.16);
      will-change: transform;
    }

    .fall-item img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      object-fit: cover;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes drift {
      from { transform: translateY(-4px) rotate(-1deg); }
      to { transform: translateY(4px) rotate(1deg); }
    }

    @keyframes puff {
      0% { scale: 1; }
      40% { scale: 1.18; }
      100% { scale: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .not-found-eyebrow,
      .not-found-code,
      .not-found-bubble,
      .not-found-words h1,
      .not-found-words p.not-found-copy,
      .not-found-home {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="not-found">
    <header class="top-mark">
      <a href="/">
        <img src="/assets/icons/hej-logo.svg" alt="Hej Rafa, home">
      </a>
    </header>

    <section class="not-found-words" aria-labelledby="not-found-title">
      <p class="not-found-eyebrow">Page not found</p>
      <p class="not-found-code">
        <span class="visually-hidden">404</span>
        <span aria-hidden="true">4</span><button class="not-found-bubble" type="button" aria-label="Think of a few more good bits"><img src="/assets/images/not-found/thought-balloon.png" alt="An empty thought bubble" width="256" height="256"></button><span aria-hidden="true">4</span>
      </p>
      <h1 id="not-found-title">I can’t picture this page either</h1>
      <p class="not-found-copy">It doesn’t exist. Luckily, the good bits are still here.</p>
      <a class="not-found-home" href="/">Back home</a>
    </section>
  </main>
</body>
</html>
